# Vercel deployment of SubTrans Studio (the local dev setup uses backend/requirements.txt).
[project]
name = "subtrans-studio"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.2",
    "python-multipart==0.0.32",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "openai==3.31.0",
    "anthropic==1.14.0",
    "aiosqlite==0.22.1",
    "charset-normalizer==3.5.2",
    "python-dotenv==1.2.4",
    "asyncpg==0.31.0",
    "vercel-queue==0.9.0",
]

[tool.vercel]
entrypoint = "app:app"

# Serve the built frontend from the CDN even though the app has (API-only) auth middleware.
[tool.vercel.fastapi.static]
cdn = true

[[tool.vercel.subscribers]]
entrypoint = "worker"
